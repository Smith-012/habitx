<!doctype html>
<html>
  <head>
    <title>Smart Habit Builder - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container dashboard">
      <h2>Your Habits Dashboard</h2>
      <div class="add-habit">
        <h3>Add New Habit</h3>
        <form method="post">
          <input
            name="habit"
            type="text"
            placeholder="Enter new habit (e.g., Drink 8 glasses of water)"
            required
          />
          <button type="submit">Add Habit</button>
        </form>
      </div>
      <div class="habits-list">
        <h3>Your Current Habits</h3>
        {% if habits %}
        <ul>
          {% for h in habits %}
          <li>
            <div class="habit-info">
              <strong>{{ h[2] }}</strong>
              <span class="streak">🔥 Streak: {{ h[3] }} days</span>
            </div>
            <a href="/done/{{h[0]}}" class="done-btn">✔ Mark Done</a>
          </li>
          {% endfor %}
        </ul>
        {% else %}
        <p class="no-habits">No habits yet. Add your first habit above!</p>
        {% endif %}
      </div>
      <div class="logout-section">
        <a href="/logout" class="logout-btn">Logout</a>
      </div>
    </div>
  </body>
</html>
